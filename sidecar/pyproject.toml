[project]
name = "stelix-sidecar"
version = "0.1.0"
description = "Stelix's Intermediate and Pro Studio levels: BS-Roformer with mlx-audio-separator."
requires-python = ">=3.12,<3.13"
# 0.1.20 is the version tested with the .ckpt files in ~/.cache. The .ckpt files are read by
# stelix_sidecar.read_ckpt, without PyTorch.
dependencies = ["mlx-audio-separator==0.1.20"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["stelix_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
